name: Build and push discord bot image
on:
  push:
    branches:
      - main
    paths:
      - 'apps/discord-bot/**'
      - 'packages/**'
      - '.github/**'

  pull_request:
    paths:
      - 'apps/discord-bot/**'
      - 'packages/**'
      - '.github/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./apps/discord-bot/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }} # ✅ push only when branch is main
          tags: ghcr.io/mindustrytool/mindustry-tool-discord-bot:latest

      - name: Trigger Watchtower Webhook
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "Triggering Watchtower update..."
          curl -f -s -X POST -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            https://api.mindustry-tool.com/watchtower/v1/update
