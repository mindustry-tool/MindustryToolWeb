name: Backend CI
on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - '.github/**'

  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - '.github/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run backend tests
        run: pnpm --filter backend test --testPathPattern="profanity"

      - name: Run api package tests
        run: pnpm --filter @mindustry-tool/api test


  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./apps/backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }} # ✅ push only when branch is main 
          tags: ghcr.io/mindustrytool/mindustry-tool-api-v4:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Trigger Watchtower Webhook
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "Triggering Watchtower update..."
          curl -f -s -X POST -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            https://api.mindustry-tool.com/watchtower/v1/update
